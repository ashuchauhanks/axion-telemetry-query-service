

trigger:
  branches:
    include:
    - main

pool: selfhost-aks

stages:

- stage: BuildAndPush
  displayName: 'Build and Push telemtry-query Service'
  jobs:
  - job: dockerbuildandPush
    displayName: 'Build Docker Image and Push to ACR'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    - task: Docker@1

      displayName: acr login -{Container Reg. type- ACR , with ARM Service connection}
      inputs:
        containerregistrytype: 'Azure Container Registry'
        addBaseImageData: false
        azureSubscriptionEndpoint: 'SVC-AZ-ARM-250926'
        azureContainerRegistry: 'acrashudevka.azurecr.io'
        command: 'login'

    - task: Docker@1

      displayName: acr login -{with docker registry - Service connection (Type-ACR) }
      inputs:
        containerregistrytype: 'Container Registry'
        addBaseImageData: false
        dockerRegistryEndpoint: 'acr-svc-msi-1'
        command: 'login'


    - task: Docker@2

      displayName: acr login - with docker registry(Type-ACR) Service connection
      inputs:
        containerRegistry: 'acr-svc-msi-1'
        command: 'login'
        addPipelineData: false
        addBaseImageData: false

    - task: Docker@2

      displayName: 'Build & Push Docker Image'
      inputs:
        containerRegistry: 'acr-svc-msi-1'
        repository: 'axion-telemetry-query-service'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'


- stage: DeployToAKS
  displayName: 'Deploy Ingestion Service to AKS'

  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: 'Deploy to AKS'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    - task: KubernetesManifest@1
      inputs:
        action: 'deploy'
        connectionType: 'kubernetesServiceConnection'
        kubernetesServiceConnection: 'AzureKubernetesServiceConnection-aks-dev'
        namespace: 'axion'
        manifests: |
          manifest/deployment.yml
          manifest/service.yml
        containers: 'acrashudevka.azurecr.io/axion-telemetry-query-service:$(Build.BuildId)'


